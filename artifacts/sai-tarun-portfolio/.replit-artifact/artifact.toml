kind = "web"
previewPath = "/"
title = "Sai Tarun Java Portfolio"
description = "A polished personal portfolio for Sai Tarun Allu, a Java Software Engineer focused on Core Java, JDBC, SQL, backend projects, and practical engineering depth."
version = "1.0.0"
id = "artifacts/sai-tarun-portfolio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25534

[services.development]
run = "pnpm --filter @workspace/sai-tarun-portfolio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sai-tarun-portfolio", "run", "build" ]
serve = "static"
publicDir = "artifacts/sai-tarun-portfolio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25534"
BASE_PATH = "/"
